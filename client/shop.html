<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop sneakers | KicksHub</title>
  <meta name="description" content="Filter sneakers by brand, size, color, and price in Ghana cedis.">
  <meta property="og:title" content="Shop sneakers | KicksHub">
  <meta property="og:description" content="Filter sneakers by brand, size, color, and price in Ghana cedis.">
  <meta property="og:type" content="website">
  
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('kickshub_theme');
        if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (err) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="logo" href="/">KICKS<span>HUB</span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">Menu</button>
    <nav id="primary-nav" class="primary-nav" aria-label="Primary">
      <a href="/shop">Shop</a>
      <a href="/shop?gender=men">Men</a>
      <a href="/shop?gender=women">Women</a>
      <a href="/shop?new=true">New</a>
      <a href="/shop?collection=classics">Classics</a>
    </nav>
    <div class="header-tools">
      <button class="icon-btn" type="button" data-open-search>Search</button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle color theme">Theme</button>
      <a class="icon-btn" href="/wishlist">Saved</a>
      <a class="icon-btn" href="/login" data-account-link>Account</a>
      <a class="icon-btn cart-link" href="/cart">Bag <span data-cart-count>0</span></a>
    </div>
  </header>
  <main id="main">
    <h1 data-shop-title>Shop</h1>
    <button class="btn filters-toggle" type="button" data-filters-toggle aria-expanded="false">Filters</button>
    <div class="shop-layout">
      <form class="filters" data-filters>
        <label>Search<input name="q" type="search"></label>
        <label>Gender
          <select name="gender"><option value="">All</option><option value="men">Men</option><option value="women">Women</option><option value="unisex">Unisex</option><option value="kids">Kids</option></select>
        </label>
        <label>Brand<select name="brand"><option value="">All brands</option></select></label>
        <label>Collection<select name="collection"><option value="">All collections</option></select></label>
        <label>Color<select name="color"><option value="">Any color</option></select></label>
        <label>Size<select name="size"><option value="">Any size</option><option value="35">EU 35</option><option value="36">EU 36</option><option value="37">EU 37</option><option value="38">EU 38</option><option value="39">EU 39</option><option value="40">EU 40</option><option value="41">EU 41</option><option value="42">EU 42</option><option value="43">EU 43</option><option value="44">EU 44</option><option value="45">EU 45</option><option value="46">EU 46</option><option value="47">EU 47</option></select></label>
        <label>Min price (GHS)<input name="minPrice" inputmode="numeric"></label>
        <label>Max price (GHS)<input name="maxPrice" inputmode="numeric"></label>
        <label>Sort
          <select name="sort">
            <option value="newest">Newest</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="popular">Popular</option>
          </select>
        </label>
        <button class="btn" type="submit">Apply</button>
        <button class="btn-ghost" type="reset">Clear</button>
      </form>
      <div>
        <div class="grid" data-grid></div>
        <nav class="pager" data-pager aria-label="Pages"></nav>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <div>
      <p class="logo">KICKS<span>HUB</span></p>
      <p>Sneakers delivered across Ghana. Prices in cedis.</p>
    </div>
    <form class="newsletter" data-newsletter>
      <label for="news-email">Newsletter</label>
      <div>
        <input id="news-email" name="email" type="email" required placeholder="you@email.com" autocomplete="email">
        <button class="btn" type="submit">Join</button>
      </div>
    </form>
    <nav aria-label="Help">
      <a href="/shipping">Shipping and returns</a>
      <a href="/faq">FAQ</a>
      <a href="/contact">Contact</a>
    </nav>
  </footer>
  <div class="toasts" aria-live="polite"></div>
  <dialog class="search-dialog" data-search-dialog>
    <form method="dialog"><button class="dialog-close" type="submit" value="cancel" aria-label="Close"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></form>
    <label>Search sneakers
      <input data-search-input type="search" placeholder="Air Force, Samba, Jordan">
    </label>
    <ul data-search-results></ul>
  </dialog>
  <script type="module" src="/js/shop.js"></script>
</body>
</html>
