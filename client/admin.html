<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | KicksHub</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('kickshub_theme');
        if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (err) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <div id="gate" class="panel" hidden></div>
  <div class="admin-shell" id="shell" hidden>
    <nav class="admin-nav" aria-label="Admin">
      <a class="logo" href="/admin" data-nav>KICKS<span>HUB</span></a>
      <a href="/admin" data-nav data-path="/admin">Overview</a>
      <a href="/admin/orders" data-nav data-path="/admin/orders">Orders</a>
      <a href="/admin/products" data-nav data-path="/admin/products">Products</a>
      <a href="/admin/catalog" data-nav data-path="/admin/catalog">Brands</a>
      <a href="/admin/promos" data-nav data-path="/admin/promos">Promos</a>
      <a href="/admin/reviews" data-nav data-path="/admin/reviews">Reviews</a>
      <a href="/admin/customers" data-nav data-path="/admin/customers">Customers</a>
      <a href="/admin/settings" data-nav data-path="/admin/settings">Settings</a>
      <a href="/">View shop</a>
    </nav>
    <main class="admin-main" id="app"></main>
  </div>
  <div class="toasts" aria-live="polite"></div>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
